<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zentrades URL Shortener</title>
    <!-- Google Fonts: Montserrat (Headers) & Inter (Body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Montserrat:wght@700;800&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <div class="logo">
            ZenTrades
        </div>

        <div class="card">
            <form id="shortenForm">
                <div class="input-group">
                    <input type="url" id="longUrl" placeholder="Paste your long link here..." required
                        autocomplete="off">
                </div>
                <button type="submit" class="primary-btn" id="submitBtn">
                    Shorten
                </button>
            </form>

            <div id="result">
                <!-- Result will be injected here via JS -->
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
