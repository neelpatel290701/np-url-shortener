<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LinkZip URL Shortener</title>
    <meta name="description" content="Quickly shorten long URLs with our sleek and fast tool.">
    <!-- Google Fonts: Inter & Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700;800&display=swap"
        rel="stylesheet">
    <!-- Phosphor Icons (for some extra flair) -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- Animated background elements -->
    <div class="bg-orb orb-1"></div>
    <div class="bg-orb orb-2"></div>
    <div class="bg-orb orb-3"></div>

    <main class="container">
        <header class="header">
            <h1 class="logo">
                <i class="ph ph-link"></i> LinkZip
            </h1>
            <p class="subtitle">Shorten, share, and track your links with ease.</p>
        </header>

        <section class="card glass">
            <form id="shortenForm">
                <div class="input-group">
                    <div class="input-wrapper">
                        <i class="ph ph-link-simple input-icon"></i>
                        <input type="url" id="longUrl" placeholder="Paste your exceptionally long link here..." required
                            autocomplete="off">
                    </div>
                </div>
                <button type="submit" class="primary-btn" id="submitBtn">
                    <span>Shorten URL</span>
                    <i class="ph ph-magic-wand"></i>
                </button>
            </form>

            <div id="result">
                <!-- Result will be injected here via JS -->
            </div>
        </section>

        <footer class="footer">
            <p>&copy; 2026 LinkZip. All rights reserved.</p>
        </footer>
    </main>

    <script src="script.js"></script>
</body>

</html>
