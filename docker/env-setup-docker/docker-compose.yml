version: '3.9'

services:
  mongodb:
    container_name: url-shortener-mongo
    restart: always
    image: mongo:4.2.20
    environment:
      - MONGO_INITDB_ROOT_USERNAME=root
      - MONGO_INITDB_ROOT_PASSWORD=ssmongodb
    volumes:
      - type: bind
        source: "${VOLUME_MOUNT_BASE_DIR}/mongodb/data"
        target: /data/
    networks:
      - zt-app-network
    extra_hosts:
      - "localhost:127.0.0.1"
    ports: ["127.0.0.1:27017:27017"]
    expose:
      - 27017

  redis:
    container_name: url-shortener-redis
    restart: always
    image: redis:6.0.5-alpine
    volumes:
      - type: bind
        source: "${VOLUME_MOUNT_BASE_DIR}/redis/data"
        target: /data
    networks:
      - zt-app-network
    ports: ["6379:6379"]
    expose:
      - 6379

  nginx:
    container_name: url-shortener-nginx
    build:
      dockerfile: ../nginx-docker/Dockerfile
      context: ../nginx-docker/
    image: url-shortener-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    networks:
      - zt-app-network
    extra_hosts:
      - "host.docker.internal:host-gateway"    

networks:
  zt-app-network:
