server {
    listen 80;
    listen [::]:80;
    server_name tiny.zt.pro; 
    
    #ssl on;
    #ssl_certificate    /etc/smartserv/certs/nginx/star_smartserv_io.crt;
    #ssl_certificate_key    /etc/smartserv/certs/nginx/smartserv.key;

    add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
    add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range';
    add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range';

    access_log /var/log/nginx/nginx.vhost.services.access.log custom_access;
    error_log /var/log/nginx/nginx.vhost.services.error.log warn;
   

   location / {
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_pass http://host.docker.internal:4001;
}

}
